<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <!-- <link rel="stylesheet" href="{{ '/assets/css/variables.css' | relative_url }}"> -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/color.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="container">
        <header>
            <a href ="{{ '/' | relative_url }}">
                <img class="title-image" src="{{ page.title_image | relative_url }}" alt="{{ site.title }}">
            </a>
            <nav>
                {% for item in site.data.navigation %}
                    <a class="button" href="{{ item.url | relative_url }}">{{ item.title }}</a>
                {% endfor %}
            </nav>
        </header>

        <main>
            <h1>{{ page.title }}</h1>
            {{ content }}
        </main>
    </div>
</body>
</html>
